name: medical_event_recorder
description: Medical Event Recorder
publish_to: 'none'
version: 1.1.0+5

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.4
  uuid: ^4.4.2
  intl: ^0.20.2
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  cross_file: ^0.3.4+2
  file_selector: ^1.0.3
  msix: ^3.16.13
  url_launcher: ^6.3.1
  awesome_notifications: ^0.11.0
  sentry_flutter: ^9.0.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/Blue_background_without_MER.png
    - assets/Transparent_without_MER.png
    - assets/Transparent_with_MER.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/Blue_background_without_MER.png
  adaptive_icon_background: "#0D4F82"
  adaptive_icon_foreground: assets/Transparent_without_MER.png
  windows:
    generate: true
    image_path: assets/Blue_background_without_MER.png
    icon_size: 48

flutter_native_splash:
  color: "#0D4F82"
  image: assets/Transparent_with_MER.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#0D4F82"
    image: assets/Transparent_without_MER.png

msix_config:
  display_name: Medical Event Recorder
  publisher_display_name: Notiva
  identity_name: Notiva.MedicalEventRecorder
  publisher: CN=520D1E31-3542-4059-8124-5366ECCA4994
  msix_version: 1.0.0.0
  logo_path: windows/runner/resources/app_icon.ico
  create_assets: false
  sign_msix: false