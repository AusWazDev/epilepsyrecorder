name: medical_event_recorder
description: Medical Event Recorder
publish_to: 'none'
version: 1.1.0+20

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.4
  uuid: ^4.4.2
  intl: ^0.20.2
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  cross_file: ^0.3.4+2
  file_selector: ^1.0.3
  msix: ^3.16.13
  url_launcher: ^6.3.1
  awesome_notifications: ^0.11.0
  sentry_flutter: ^9.0.0
  package_info_plus: ^9.0.1
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.4.0+3
  sqlite3_flutter_libs: ^0.6.0+eol
  sqflite_common: ^2.5.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Already present transitively via file_selector. Declared here so
  # test/backup_type_group_test.dart can drive the real iOS type-group
  # translation instead of a copy of its rules — the boundary no test crossed
  # when "Restore from backup does nothing on iOS" shipped.
  file_selector_ios: ^0.5.3
  # Also already transitive. Declared so test/share_failure_test.dart can swap
  # in a fake FileSelectorPlatform and prove a cancelled dialog stays silent
  # while a failing one surfaces — file_selector itself re-exports only
  # FileSaveLocation, XFile and XTypeGroup, not the platform interface.
  file_selector_platform_interface: ^2.6.0
  # Also already transitive. The share paths build a temp file first, and under
  # the widget-test binding a real path_provider call never completes rather
  # than failing, so the guard could not be reached without a fake here.
  path_provider_platform_interface: ^2.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/Blue_background_without_MER.png
    - assets/Transparent_without_MER.png
    - assets/Transparent_with_MER.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/Blue_background_without_MER.png
  adaptive_icon_background: "#0D4F82"
  adaptive_icon_foreground: assets/Transparent_without_MER.png
  windows:
    generate: true
    image_path: assets/Blue_background_without_MER.png
    icon_size: 48

flutter_native_splash:
  color: "#0D4F82"
  image: assets/Transparent_with_MER.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#0D4F82"
    image: assets/Transparent_without_MER.png

msix_config:
  # ── STORE IDENTITY — IMMUTABLE ONCE PUBLISHED ────────────────────────────
  # identity_name, publisher and publisher_display_name below must match
  # Partner Center EXACTLY. They are fixed for the life of the listing, in the
  # same class as the Android applicationId, the iOS bundle id and
  # kEventStorageKey: changing one does not rename the app, it creates a
  # DIFFERENT app that existing users cannot upgrade to.
  #
  # Find them at: partner.microsoft.com/dashboard > Product > Product identity
  #   identity_name          -> Package/Identity/Name
  #   publisher              -> Package/Identity/Publisher
  #   publisher_display_name -> Package/Properties/PublisherDisplayName
  #
  # A mismatch is rejected at submission, and a local build gives no hint of
  # it: the msix tool substitutes its own defaults for anything absent and
  # packages happily. Verify against the built AppxManifest.xml, not against
  # a successful build.
  #
  # `publisher` is also the certificate SUBJECT. Signing requires a cert whose
  # subject matches it character for character; the real one is on this
  # machine in CurrentUser\My, thumbprint 1F47F898D58528C072D4B19AFD81814117FFBF6A.
  display_name: Medical Event Recorder
  publisher_display_name: Notiva
  identity_name: Notiva.MedicalEventRecorder
  publisher: CN=520D1E31-3542-4059-8124-5366ECCA4994
  # NOT derivable from `version:` above, and this is the one place in the
  # project where a version is deliberately written down twice.
  #
  # The msix tool CAN derive it — remove this line and it falls back to
  # _getPubspecVersion(), which returns [major, minor, patch, 0]. For 1.1.0+6
  # that is 1.1.0.0: the build number is discarded, so every build within a
  # patch version packages as the same MSIX version. That is exactly the
  # ambiguity this line exists to remove — on Android, two builds sharing a
  # version is how a pre-migration state was read as a completed migration.
  #
  # THE MAPPING, because it will not be obvious: MSIX reserves the FOURTH part
  # for the Store and requires it to be zero, so pubspec's build number cannot
  # live there. 1.1.0+6 is folded into the three usable parts as 1.1.6.0 —
  # major.minor.<build>.0. Bump the third part whenever pubspec's build number
  # moves and a Windows package is cut.
  #
  # Live Store package is 1.0.0.0 (Submission 2, x64), so this is an upgrade.
  # A version below the published one is rejected, and the Store treats the
  # fourth part as its own.
  msix_version: 1.1.6.0
  logo_path: windows/runner/resources/app_icon.ico
  create_assets: false
  sign_msix: false