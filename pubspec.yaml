name: Medical_Event_Recorder
description: Medical Event Recorder
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.4
  uuid: ^4.4.2
  intl: ^0.20.2
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  cross_file: ^0.3.4+2
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png

flutter_native_splash:
  color: "#4F46E5"
  image: assets/app_icon.png
  android: true
  ios: true
