<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Blue background, no MER text.
    Full-size clipboard (same proportions as Blue_background_with_MER), centred vertically.
    Shift +17px from original to compensate for removed MER text.
  -->

  <!-- Blue background -->
  <rect width="1024" height="1024" rx="225" fill="#0D4F82"/>

  <!-- Clipboard body -->
  <rect x="225" y="252" width="574" height="520" rx="40" fill="none" stroke="white" stroke-width="28" opacity="0.9"/>
  <rect x="225" y="252" width="574" height="520" rx="40" fill="white" opacity="0.08"/>

  <!-- Clip at top -->
  <rect x="389" y="180" width="246" height="102" rx="30" fill="white" opacity="0.95"/>
  <rect x="440" y="144" width="144" height="72" rx="30" fill="white" opacity="0.7"/>

  <!-- Top rule line -->
  <line x1="294" y1="377" x2="730" y2="377" stroke="white" stroke-width="14" opacity="0.3"/>

  <!-- ECG pulse line -->
  <polyline
    points="266,517 368,517 420,387 476,647 528,457 580,567 632,517 758,517"
    fill="none" stroke="white" stroke-width="36"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom rule line -->
  <line x1="294" y1="597" x2="614" y2="597" stroke="white" stroke-width="14" opacity="0.3"/>

  <!-- Coral cross — vertical -->
  <rect x="656" y="262" width="40" height="132" rx="12" fill="#E05B3A"/>
  <!-- Coral cross — horizontal -->
  <rect x="608" y="310" width="136" height="40" rx="12" fill="#E05B3A"/>
</svg>
