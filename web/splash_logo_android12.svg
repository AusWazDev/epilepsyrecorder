<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Android 12+ SplashScreen splash icon.
    Transparent background — #0D4F82 set via windowSplashScreenBackground in styles.xml.
    Full design scaled to 75%, centred on canvas (512,512).
    At 75% scale the MER text baseline sits ~321px from centre,
    inside the Android 12+ circular safe zone (radius ~341px).
  -->
  <g transform="translate(512,512) scale(0.75) translate(-512,-512)">

    <!-- Clipboard body -->
    <rect x="225" y="235" width="574" height="520" rx="40" fill="none" stroke="white" stroke-width="28" opacity="0.9"/>
    <rect x="225" y="235" width="574" height="520" rx="40" fill="white" opacity="0.08"/>

    <!-- Clip at top -->
    <rect x="389" y="163" width="246" height="102" rx="30" fill="white" opacity="0.95"/>
    <rect x="440" y="127" width="144" height="72" rx="30" fill="white" opacity="0.7"/>

    <!-- Top rule line -->
    <line x1="294" y1="360" x2="730" y2="360" stroke="white" stroke-width="14" opacity="0.3"/>

    <!-- ECG pulse line -->
    <polyline
      points="266,500 368,500 420,370 476,630 528,440 580,550 632,500 758,500"
      fill="none" stroke="white" stroke-width="36"
      stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom rule line -->
    <line x1="294" y1="580" x2="614" y2="580" stroke="white" stroke-width="14" opacity="0.3"/>

    <!-- Coral cross — vertical -->
    <rect x="656" y="245" width="40" height="132" rx="12" fill="#E05B3A"/>
    <!-- Coral cross — horizontal -->
    <rect x="608" y="293" width="136" height="40" rx="12" fill="#E05B3A"/>

    <!-- MER text -->
    <text x="512" y="940" text-anchor="middle"
      font-family="Arial, sans-serif" font-size="164" font-weight="800"
      fill="white" letter-spacing="20">MER</text>

  </g>
</svg>
