<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1024" rx="225" fill="#0D4F82"/>

  <!-- Clipboard body -->
  <rect x="225" y="195" width="574" height="490" rx="40" fill="none" stroke="white" stroke-width="28" opacity="0.9"/>
  <rect x="225" y="195" width="574" height="490" rx="40" fill="white" opacity="0.08"/>

  <!-- Clip at top -->
  <rect x="389" y="123" width="246" height="102" rx="30" fill="white" opacity="0.95"/>
  <rect x="440" y="87" width="144" height="72" rx="30" fill="white" opacity="0.7"/>

  <!-- Top rule line -->
  <line x1="294" y1="320" x2="730" y2="320" stroke="white" stroke-width="14" opacity="0.3"/>

  <!-- ECG pulse line -->
  <polyline
    points="266,455 368,455 420,325 476,585 528,395 580,505 632,455 758,455"
    fill="none"
    stroke="white"
    stroke-width="36"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Bottom rule line -->
  <line x1="294" y1="535" x2="614" y2="535" stroke="white" stroke-width="14" opacity="0.3"/>

  <!-- Coral cross — vertical -->
  <rect x="656" y="205" width="40" height="132" rx="12" fill="#E05B3A"/>
  <!-- Coral cross — horizontal -->
